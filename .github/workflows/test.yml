name: test

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master'

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v2
      
      # Use rsync to deploy only build files
      - name: rsync deployments
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete
          # path: ./build/
          remote_path: /server/
          remote_host: ec2-18-117-11-127.us-east-2.compute.amazonaws.com
          remote_user: ubuntu
          remote_key: "${{ secrets.MY_KEY }}"